name: X-Ecom Node.js CI/CD

on:
  push:
    branches: develop

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Print repository name
      run: echo "The repository is ${{ github.repository }}"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_REGISTRY_TOKEN }}

    - name: Set environment variables
      run: |
        echo "ENV_VAR=${{ secrets.ENV_VAR }}" >> .env
  
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/x-ecom-app:latest
  
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Executing remote SSH commands using SSH key
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.PATH_PROCJECT }}
            docker-compose down;
            docker pull ghcr.io/${{ github.repository }}/${{ env.APP_CONTAINER_NAME }}:latest
            docker-compose up -d;
